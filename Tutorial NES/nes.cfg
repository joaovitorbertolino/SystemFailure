# ==============================================================================
#  nes.cfg  -  configuração do linker (ld65) para um cartucho NROM (mapper 0)
#              32 KB de PRG-ROM + 8 KB de CHR-ROM
#
#  MEMORY   = "gavetas" físicas (onde cada coisa mora: RAM da CPU, ROM, CHR...)
#  SEGMENTS = quais segmentos do seu .asm vão para qual gaveta
# ==============================================================================

MEMORY {
    # ---- RAM da CPU (2 KB: $0000-$07FF). file = "" -> não vai para o arquivo .nes
    ZP:      file = "",   start = $0000, size = $0100, type = rw;   # Zero Page: variáveis rápidas
    OAMBUF:  file = "",   start = $0200, size = $0100, type = rw;   # cópia (sombra) da OAM p/ DMA
    RAM:     file = "",   start = $0300, size = $0500, type = rw;   # RAM comum

    # ---- Arquivo .nes = cabeçalho iNES + PRG-ROM + CHR-ROM (nessa ordem)
    HDR:     file = %O,   start = $0000, size = $0010, type = ro, fill = yes, fillval = $00;
    PRG:     file = %O,   start = $8000, size = $8000, type = ro, fill = yes, fillval = $FF;
    CHR:     file = %O,   start = $0000, size = $2000, type = ro, fill = yes, fillval = $00;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    OAM:      load = OAMBUF, type = bss, align = $100;
    BSS:      load = RAM,    type = bss, optional = yes;

    HEADER:   load = HDR,    type = ro;
    CODE:     load = PRG,    type = ro;
    RODATA:   load = PRG,    type = ro;
    VECTORS:  load = PRG,    type = ro, start = $FFFA;    # NMI, RESET, IRQ (6 bytes no fim)

    CHR_BG:   load = CHR,    type = ro;                                  # tabela de padrões 0: PPU $0000-$0FFF
    CHR_SPR:  load = CHR,    type = ro, start = $1000, optional = yes;   # tabela de padrões 1: PPU $1000-$1FFF
}
